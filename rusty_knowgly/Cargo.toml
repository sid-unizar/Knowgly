[package]
name = "rusty_knowgly"
version = "0.1.0"
edition = "2024"

[dependencies]
sophia = {version = "0.10.0" , features = ["sparql", "http_client"]}
reqwest = {version = "0.13.5" , features = ["blocking"]}
indicatif = {version = "0.18.6", features = ["rayon"]}
rayon = "1.12.0"
log = { version = "0.4.35" }
ckmeans = "2.2.0"
serde = "1.0.229"
serde_json = "1.0.154"
env_logger = "0.11.11"
regex = "1.13.1"
csv = "1.4.0"
once_cell = "1.21.4"
serde-jsonlines = "0.7.0"
clap = { version = "4.6.7", features = ["derive"] }
serde_with = "3.24.0"
itertools = "0.15.0"
