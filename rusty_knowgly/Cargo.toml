[package]
name = "rusty_knowgly"
version = "0.1.0"
edition = "2024"

[dependencies]
sophia = {version = "0.9.0" , features = ["sparql", "http_client"]}
reqwest = {version = "0.12.28" , features = ["blocking"]}
indicatif = {version = "0.18.4", features = ["rayon"]}
rayon = "1.11.0"
log = { version = "0.4.29" }
ckmeans = "1.2.0"
serde = "1.0.228"
serde_json = "1.0.149"
env_logger = "0.11.9"
regex = "1.12.3"
csv = "1.4.0"
once_cell = "1.21.4"
serde-jsonlines = "0.7.0"
clap = { version = "4.6.0", features = ["derive"] }
serde_with = "3.18.0"
itertools = "0.14.0"
